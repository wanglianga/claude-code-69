services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renovation}
      POSTGRES_USER: ${POSTGRES_USER:-renovation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renovation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renovation} -d ${POSTGRES_DB:-renovation}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 数据库端口不发布到宿主，仅在 compose 内部网络可见

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-renovation}
      DB_USER: ${POSTGRES_USER:-renovation}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-renovation}
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
